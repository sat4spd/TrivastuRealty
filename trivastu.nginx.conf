# Nginx config for Trivastu — ALL on AWS EC2
# Backend API + Next.js dashboard on ONE server
#
# Install: sudo cp trivastu.nginx.conf /etc/nginx/sites-available/trivastu
#          sudo ln -s /etc/nginx/sites-available/trivastu /etc/nginx/sites-enabled/trivastu
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace:
#   api.yourdomain.com   → your API subdomain (e.g., api.trivastu.com)
#   admin.yourdomain.com → your dashboard subdomain (e.g., admin.trivastu.com)

# ─── Global: hide Nginx version ────────────────────────────────────────────
# This is set globally in /etc/nginx/nginx.conf but repeated here for clarity:
# server_tokens off;

# ─── Security headers map (reusable across server blocks) ──────────────────
# NOTE: The headers below are added inside each server block's location block.

# ─── Backend API + WhatsApp Webhook ────────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    # Hide Nginx version
    server_tokens off;

    # ── CVE-2025-23419: Disable TLS session tickets per server block ────────
    # (Only effective if SSL is terminated here; if SSL is at a load balancer, skip)
    # ssl_session_tickets off;

    location / {
        # Block HTTP OPTIONS method (reduces attack surface)
        if ($request_method = OPTIONS) {
            return 405;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Required for Socket.IO (live chat + logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://*.amazonaws.com wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }
}

# ─── Next.js Admin Dashboard ───────────────────────────────────────────────
server {
    listen 80;
    server_name admin.yourdomain.com;

    # Hide Nginx version
    server_tokens off;

    # ── CVE-2025-23419: Disable TLS session tickets ─────────────────────────
    # ssl_session_tickets off;

    location / {
        # Block HTTP OPTIONS method
        if ($request_method = OPTIONS) {
            return 405;
        }

        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        # Required for Next.js hot reload / WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.trivastu.com https://www.google-analytics.com wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }
}

