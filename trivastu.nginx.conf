# ─── Redirects ─────────────────────────────────────────────────────
server {
    if ($host = api.trivastu.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name api.trivastu.com;
    return 404;
}
server {
    if ($host = admin.trivastu.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name admin.trivastu.com;
    return 404;
}

