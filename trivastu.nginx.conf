# Nginx config for Trivastu Realty — ALL on AWS EC2
# Both backend API + Next.js dashboard on ONE server
#
# Install: sudo cp trivastu.conf /etc/nginx/sites-available/trivastu
#          sudo ln -s /etc/nginx/sites-available/trivastu /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace:
#   api.yourdomain.com      → your API subdomain (e.g., api.trivastu.com)
#   admin.yourdomain.com    → your dashboard subdomain (e.g., admin.trivastu.com)

# ─── Backend API + WhatsApp Webhook ────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Required for Socket.IO (live chat + logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Next.js Admin Dashboard ───────────────────────────────────────
server {
    listen 80;
    server_name admin.yourdomain.com;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        # Required for Next.js hot reload / WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
